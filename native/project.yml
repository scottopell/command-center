name: CommandCenter
options:
  bundleIdPrefix: com.scottopell
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: '14.0'
targets:
  CommandCenter:
    type: application
    platform: macOS
    sources:
      - path: CommandCenter
      - path: ../dist/web
        type: folder
        buildPhase: resources
      - path: ../dist/operations.json
        buildPhase: resources
      - path: ../dist/catalog.json
        buildPhase: resources
      - path: ../dist/backend.mjs
        buildPhase: resources
      - path: ../dist/cli.mjs
        buildPhase: resources
      - path: ../dist/runtime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottopell.CommandCenter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: CommandCenter
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  CommandCenterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CommandCenterTests]
    dependencies:
      - target: CommandCenter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CommandCenter:
    build:
      targets:
        CommandCenter: all
        CommandCenterTests: [test]
    test:
      targets: [CommandCenterTests]
